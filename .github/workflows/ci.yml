name: CI

on:
  push:
    branches:
      - main
      - "openhands/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Windows / Python 3.12
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12.10"
          cache: "pip"
          cache-dependency-path: requirements-lock.txt

      - name: Upgrade packaging tools
        run: python -m pip install pip==26.2.1 setuptools==84.0.0 wheel==0.48.0

      - name: Install llama-cpp-python prebuilt Windows wheel
        run: >-
          python -m pip install
          --only-binary=:all:
          --no-deps
          --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu
          llama-cpp-python==0.3.30

      - name: Install locked dependencies
        run: python -m pip install -r requirements-lock.txt

      - name: Check dependency consistency
        run: python -m pip check

      - name: Compile sources
        run: python -m compileall -q src run.py

      - name: Run tests
        run: python -m pytest -q src/tests
