name: Clean-Machine Acceptance Test (Stage 1 — Automated)

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "GitHub release tag containing the frozen ZIP asset (e.g. v0.3-colleague-test)"
        required: false
        default: ""
      expected_zip_sha256:
        description: "Expected ZIP SHA-256 override (hex, lowercase)"
        required: false
        default: ""
      expected_exe_sha256:
        description: "Expected EXE SHA-256 override (hex, lowercase)"
        required: false
        default: ""

permissions:
  contents: read
  actions: read

concurrency:
  group: clean-machine-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────
  # STAGE 1A: Artifact integrity verification
  # Runs on every workflow trigger; gates all downstream work.
  # ──────────────────────────────────────────────
  artifact-integrity:
    name: Artifact Integrity
    runs-on: windows-latest
    outputs:
      zip_hash: ${{ steps.hash_zip.outputs.hash }}
      exe_hash: ${{ steps.hash_exe.outputs.hash }}
    steps:
      - name: Download frozen package from release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download ${{ github.event.release.tag_name }} \
            -p "SerapeumAI_v0.3_colleague_test.zip" \
            -D . -R ${{ github.repository }}
          if (-not (Test-Path SerapeumAI_v0.3_colleague_test.zip)) {
            Write-Error "Failed to download release asset"
            exit 1
          }
          Write-Host "Downloaded from release ${{ github.event.release.tag_name }}"

      - name: Download frozen package (dispatch)
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $releaseTag = "${{ github.event.inputs.release_tag }}"
          if ($releaseTag -and $releaseTag.Trim()) {
            gh release download $releaseTag `
              -p "SerapeumAI_v0.3_colleague_test.zip" `
              -D . -R ${{ github.repository }}
            if (-not (Test-Path SerapeumAI_v0.3_colleague_test.zip)) {
              Write-Error "No frozen package found. Provide release_tag pointing to a release with the ZIP asset."
              exit 1
            }
          } else {
            Write-Error "No frozen package found. Provide release_tag for the release containing the ZIP asset."
            exit 1
          }
          Write-Host "Downloaded from release $releaseTag"

      - name: Compute ZIP hash
        id: hash_zip
        run: |
          $h = (Get-FileHash SerapeumAI_v0.3_colleague_test.zip -Algorithm SHA256).Hash.ToLower()
          echo "hash=$h" >> $env:GITHUB_OUTPUT
          Write-Host "ZIP hash:   $h"

      - name: Verify ZIP identity
        run: |
          $expected = "${{ github.event.inputs.expected_zip_sha256 }}".Trim().ToLower()
          $actual  = "${{ steps.hash_zip.outputs.hash }}"
          if (-not $expected) { $expected = "69457b13334d87b8f9720be2c42b308681d1fedddeb18e34dae16f576cb20c86" }
          if ($actual -ne $expected) {
            Write-Error "ZIP hash mismatch: actual=$actual expected=$expected"
            exit 1
          }
          Write-Host "ZIP hash verified: $actual"

      - name: Extract package
        run: Expand-Archive -Path SerapeumAI_v0.3_colleague_test.zip -DestinationPath SerapeumTest -Force

      - name: Compute EXE hash
        id: hash_exe
        run: |
          $exe = Get-ChildItem SerapeumTest -Recurse -Filter "SerapeumAI.exe" | Select-Object -First 1
          if (-not $exe) { Write-Error "SerapeumAI.exe not found in extracted package"; exit 1 }
          $h = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLower()
          echo "hash=$h" >> $env:GITHUB_OUTPUT
          Write-Host "EXE path: $($exe.FullName)"
          Write-Host "EXE hash: $h"

      - name: Verify EXE identity
        run: |
          $expected = "${{ github.event.inputs.expected_exe_sha256 }}".Trim().ToLower()
          $actual  = "${{ steps.hash_exe.outputs.hash }}"
          if (-not $expected) { $expected = "8d521dda97315f1ee05da61b2d29d89938b5b30706b021a80b5a57866dab3618" }
          if ($actual -ne $expected) {
            Write-Error "EXE hash mismatch: actual=$actual expected=$expected"
            exit 1
          }
          Write-Host "EXE hash verified: $actual"

      - name: Check prohibited content
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead("SerapeumAI_v0.3_colleague_test.zip")
          # Match prohibited patterns as path segments (not substrings) to avoid
          # false positives from third-party libraries (e.g. torch/_experimental/)
          $prohibitedPatterns = @(
            '\.serapeum/',   '\.serapeum$'
            'docs/internal/', 'docs/quality/'
            '^benchmark/',   '/benchmark/'
            '^experiment/',  '/experiment/'
            '\.kilo/',       '\.kilo$'
            '__pycache__/',  '__pycache__$'
            'src/tests/',    'src/tests$'
            '^build/',       '/build/'
            '^dist/',        '/dist/'
          )
          $violations = @()
          foreach ($entry in $zip.Entries) {
            $path = $entry.FullName.ToLower()
            foreach ($pat in $prohibitedPatterns) {
              if ($path -match $pat) {
                $violations += $entry.FullName
                break
              }
            }
          }
          $entryCount = $zip.Entries.Count
          $zip.Dispose()
          if ($violations.Count -gt 0) {
            Write-Error "Prohibited content found:"
            $violations | Select-Object -Unique | ForEach-Object { Write-Error "  $_" }
            exit 1
          }
          Write-Host "Prohibited content check passed ($entryCount entries scanned)"

      - name: Upload integrity evidence
        uses: actions/upload-artifact@v4
        with:
          name: stage1-integrity
          path: |
            SerapeumTest/
            *.log
          retention-days: 30

  # ──────────────────────────────────────────────
  # STAGE 1B: Application smoke test
  # Measures startup, checks for crashes, validates logs.
  # Runs only if Stage 1A passes.
  # ──────────────────────────────────────────────
  app-smoke-test:
    name: Application Smoke Test
    needs: artifact-integrity
    runs-on: windows-latest
    steps:
      - name: Download frozen package from release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download ${{ github.event.release.tag_name }} \
            -p "SerapeumAI_v0.3_colleague_test.zip" \
            -D . -R ${{ github.repository }}
          if (-not (Test-Path SerapeumAI_v0.3_colleague_test.zip)) {
            Write-Error "Failed to download release asset"
            exit 1
          }
          Write-Host "Downloaded from release ${{ github.event.release.tag_name }}"

      - name: Download frozen package (dispatch)
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $releaseTag = "${{ github.event.inputs.release_tag }}"
          if ($releaseTag -and $releaseTag.Trim()) {
            gh release download $releaseTag `
              -p "SerapeumAI_v0.3_colleague_test.zip" `
              -D . -R ${{ github.repository }}
            if (-not (Test-Path SerapeumAI_v0.3_colleague_test.zip)) {
              Write-Error "No frozen package found. Provide release_tag for the release containing the ZIP asset."
              exit 1
            }
          } else {
            Write-Error "No frozen package found. Provide release_tag for the release containing the ZIP asset."
            exit 1
          }
          Write-Host "Downloaded from release $releaseTag"

      - name: Extract
        run: Expand-Archive -Path SerapeumAI_v0.3_colleague_test.zip -DestinationPath SerapeumTest -Force

      - name: Record environment before launch
        id: env_before
        run: |
          $py = where.exe python 2>$null
          $git = where.exe git 2>$null
          $tess = where.exe tesseract 2>$null
          $pdfi = where.exe pdfinfo 2>$null
          echo "python_found=$(-not [string]::IsNullOrWhiteSpace($py))" >> $env:GITHUB_OUTPUT
          echo "git_found=$(-not [string]::IsNullOrWhiteSpace($git))" >> $env:GITHUB_OUTPUT
          echo "tesseract_found=$(-not [string]::IsNullOrWhiteSpace($tess))" >> $env:GITHUB_OUTPUT
          echo "poppler_found=$(-not [string]::IsNullOrWhiteSpace($pdfi))" >> $env:GITHUB_OUTPUT
          Write-Host "Runner environment: Python=$(-not [string]::IsNullOrWhiteSpace($py)) Git=$(-not [string]::IsNullOrWhiteSpace($git))"

      - name: Snapshot filesystem before launch
        run: Get-ChildItem . -Recurse -Depth 3 -ErrorAction SilentlyContinue |
               Select-Object FullName, Length | ConvertTo-Json |
               Out-File "$env:RUNNER_TEMP\fs-before.json" -Encoding utf8

      - name: Launch application and measure startup
        id: launch
        run: |
          $sw = [System.Diagnostics.Stopwatch]::StartNew()
          $proc = Start-Process "$PWD\SerapeumTest\SerapeumAI.exe" -PassThru -WindowStyle Normal
          $processId = $proc.Id
          Write-Host "Launched PID $processId"

          # Wait up to 90 seconds for the process to become responsive or exit
          $deadline = (Get-Date).AddSeconds(90)
          while (-not $proc.HasExited) {
            Start-Sleep -Milliseconds 500
            try {
              $proc.Refresh()
              if ($proc.Responding) {
                Write-Host "Application responded after $($sw.Elapsed.TotalSeconds)s"
                break
              }
            } catch {}
            if ((Get-Date) -gt $deadline) {
              Write-Warning "Timeout waiting for application response"
              break
            }
          }
          $sw.Stop()
          echo "startup_seconds=$([math]::Round($sw.Elapsed.TotalSeconds, 2))" >> $env:GITHUB_OUTPUT
          echo "has_exited=$($proc.HasExited)" >> $env:GITHUB_OUTPUT
          echo "exit_code=$($proc.ExitCode)" >> $env:GITHUB_OUTPUT
          echo "processId=$processId" >> $env:GITHUB_OUTPUT
          Write-Host "Startup: $($sw.Elapsed.TotalSeconds)s  Exited: $($proc.HasExited)  Code: $($proc.ExitCode)"

      - name: Check for crash / unexpected exit
        run: |
          $exited = "${{ steps.launch.outputs.has_exited }}"
          $code    = "${{ steps.launch.outputs.exit_code }}"
          if ($exited -eq 'True') {
            if ($code -ne '0') {
              Write-Error "Application exited with code $code (expected 0)"
              exit 1
            }
            Write-Warning "Application exited before timeout — may have crashed"
          } else {
            Write-Host "Application still running (timeout exceeded 90s, likely rendered window)"
          }

      - name: Wait for log file creation
        run: |
          $timeout = 30
          $deadline = (Get-Date).AddSeconds($timeout)
          # APP_ROOT resolves from __file__ location → extracted SerapeumTest directory
          $logDir = Join-Path $PWD "SerapeumTest\.serapeum\logs"
          while (-not (Test-Path (Join-Path $logDir "serapeum.log"))) {
            if ((Get-Date) -gt $deadline) {
              Write-Error "serapeum.log not created within ${timeout}s"
              exit 1
            }
            Start-Sleep -Milliseconds 500
          }
          Write-Host "Log file created at $logDir"

      - name: Inspect application log
        run: |
          $logDir = Join-Path $PWD "SerapeumTest\.serapeum\logs"
          $log = Join-Path $logDir "serapeum.log"
          Write-Host "=== Last 50 lines of serapeum.log ==="
          Get-Content $log -Tail 50
          Write-Host ""
          Write-Host "=== Error/Critical entries ==="
          $errors = Select-String $log -Pattern "ERROR|CRITICAL|Exception|Traceback" -AllMatches
          if ($errors) {
            $errors | ForEach-Object { Write-Host $_.Line }
          } else {
            Write-Host "No errors or exceptions found in log"
          }

      - name: Check for unexpected .serapeum data on host
        run: |
          # On a GitHub runner this should be empty (clean ephemeral VM)
          # Only scan within the workspace, not the entire C:\ drive
          $found = Get-ChildItem $PWD -Directory -Filter ".serapeum" -Recurse -Depth 2 -ErrorAction SilentlyContinue
          if ($found) {
            Write-Warning "Pre-existing .serapeum directories found (runner may not be fully clean):"
            $found | ForEach-Object { Write-Warning "  $($_.FullName)" }
          } else {
            Write-Host "No pre-existing .serapeum data — runner is clean"
          }

      - name: Terminate application
        run: |
          $processId = "${{ steps.launch.outputs.processId }}"
          if ($processId -and $processId.Trim()) {
            Stop-Process -Id ([int]$processId) -Force -ErrorAction SilentlyContinue
            Write-Host "Terminated PID $processId"
          }

      - name: Snapshot filesystem after launch
        run: Get-ChildItem . -Recurse -Depth 3 -ErrorAction SilentlyContinue |
               Select-Object FullName, Length | ConvertTo-Json |
               Out-File "$env:RUNNER_TEMP\fs-after.json" -Encoding utf8

      - name: Diff filesystem changes
        run: |
          $before = Get-Content "$env:RUNNER_TEMP\fs-before.json" | ConvertFrom-Json
          $after  = Get-Content "$env:RUNNER_TEMP\fs-after.json"  | ConvertFrom-Json
          $created = Compare-Object $before $after -Property FullName, Length |
                     Where-Object { $_.SideIndicator -eq '=>' }
          Write-Host "Files created during test:"
          $created | ForEach-Object { Write-Host "  $($_.FullName)" }

      - name: Archive application logs
        uses: actions/upload-artifact@v4
        with:
          name: stage1-logs
          path: |
            SerapeumTest/.serapeum/logs/
            ${{ runner.temp }}/fs-before.json
            $${{ runner.temp }}/fs-after.json
          retention-days: 30

  # ──────────────────────────────────────────────
  # STAGE 1C: Summary
  # ──────────────────────────────────────────────
  summary:
    name: Acceptance Summary
    needs: [artifact-integrity, app-smoke-test]
    if: always()
    runs-on: windows-latest
    steps:
      - name: Report results
        run: |
          echo "# Clean-Machine Acceptance Test — Stage 1 Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Artifact Integrity | ${{ needs.artifact-integrity.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| App Smoke Test    | ${{ needs.app-smoke-test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if ("${{ needs.artifact-integrity.result }}" -eq "success" -and
              "${{ needs.app-smoke-test.result }}" -eq "success") {
            echo "**Stage 1: PASS** — Proceed to Stage 2 (VM-based GUI acceptance)." >> $GITHUB_STEP_SUMMARY
          } else {
            echo "**Stage 1: FAIL** — Review artifacts above." >> $GITHUB_STEP_SUMMARY
            exit 1
          }
